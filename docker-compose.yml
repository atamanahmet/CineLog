services:
  postgres:
    image: postgres:17
    container_name: cinelog-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/CineLog
      dockerfile: Dockerfile
    container_name: cinelog-backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ./.env
    ports:
      - "${SERVER_PORT}:8080"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  rec-engine:
    build:
      context: ./recommendation-engine/service
      dockerfile: Dockerfile
    container_name: cinelog-rec-engine
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8181:8181"
    environment:
      - TRANSFORMERS_OFFLINE=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8181/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend/CineLog
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: cinelog-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  postgres_data:
  uploads_data:
