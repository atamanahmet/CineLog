# Local mode: Postgres runs in a container next to the app.
# Host and port are facts of the compose network, so they are set here, not in .env.

services:
  postgres:
    image: postgres:17
    container_name: cinelog-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:?set it in .env}
      POSTGRES_USER: ${DB_USER:?set it in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set it in .env}
      REC_DB_NAME: ${REC_DB_NAME:?set it in .env}
      REC_ENGINE_DB_PASSWORD: ${REC_ENGINE_DB_PASSWORD:?set it in .env}
      EMBEDDING_SCRIPT_DB_PASSWORD: ${EMBEDDING_SCRIPT_DB_PASSWORD:?set it in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:?set it in .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"

  rec-engine:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REC_DATABASE_URL: postgresql://app_rec_engine:${REC_ENGINE_DB_PASSWORD}@postgres:5432/${REC_DB_NAME}

volumes:
  postgres_data:
